name: Prepare a new release
on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        description: Version number for the new release

jobs:
  prepare-release:
    # To not run in forks
    if: github.repository_owner == 'packit'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write

    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
        with:
          fetch-depth: 0
      - name: Prepare release content
        uses: packit/prepare-release@b960efa53bcaba4b2789b0867852a01919571927 # v0
        with:
          version: ${{ inputs.version }}
          specfiles: fedora/python-requre.spec
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@38e0b6e68b4c852a5500a94740f0e535e0d7ba54 # v4
        with:
          labels: release
          commit-message: Release ${{ inputs.version }}
          title: Release ${{ inputs.version }}
          body: Update the changelog and the specfile for release ${{ inputs.version }}.
          delete-branch: true
